name: Ordion Release

# Builds the branded "Ordion SMS" APK. On a pull request to ordion it only
# proves the build + signing still work; on a v* tag it publishes a GitHub
# Release whose app-release.apk is what Ordion links from SMS_GATEWAY_APK_URL.
#
# Requires repo secrets (same names upstream uses): GOOGLE_SERVICES_JSON,
# SIGNING_KEY_STORE_BASE64, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD,
# SIGNING_STORE_PASSWORD. applicationId stays me.capcom.smsgateway.

on:
  pull_request:
    branches: [ordion]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Set app version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev"
          fi
          sed -i "s/versionName.*/versionName \"${VERSION_NAME}\"/" app/build.gradle
          sed -i "s/versionCode.*/versionCode $(( ($(date +%s) - $(date -d "2022-06-15" +%s)) / 86400 ))/" app/build.gradle
          grep -E "versionName|versionCode" app/build.gradle

      - name: Unit tests
        run: ./gradlew test

      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk | tee app-release.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordion-sms-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
